<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mihomo 透明代理 - 订阅与快捷管理</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --subtext: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --success: #22c55e;
            --border: #334155;
        }
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 520px;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 22px;
            margin: 0 0 8px 0;
            color: var(--primary);
        }
        .header p {
            font-size: 14px;
            color: var(--subtext);
            margin: 0;
        }
        .card {
            background-color: var(--card);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.2s;
        }
        .btn-primary {
            background-color: var(--primary);
            color: #0f172a;
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
            color: #ffffff;
        }
        .input-group {
            margin-bottom: 12px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 14px;
            box-sizing: border-box;
        }
        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .tip {
            font-size: 13px;
            color: var(--subtext);
            line-height: 1.5;
            margin-top: 8px;
        }
        .badge {
            background: #22c55e22;
            color: var(--success);
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Mihomo 系统级透明代理</h1>
            <p>内核级接管 · 无感免钥匙 · 全局防泄漏</p>
        </div>

        <div class="card">
            <div class="card-title">
                <span>🌐 控制台与节点切换</span>
                <span class="badge">运行中</span>
            </div>
            <a href="/ui/" class="btn btn-primary" style="margin-bottom: 8px;">打开 MetacubexD 节点控制面板</a>
            <div class="tip">在控制面板中可手动选择特定香港/日本/美国节点，或切换为“自动选择”测速模式。</div>
        </div>

        <div class="card">
            <div class="card-title">📥 快捷更新订阅说明</div>
            <div class="tip" style="margin-top: 0;">
                本透明代理支持在 <b>Magisk 应用</b> 中直接管理：
                <ol style="padding-left: 20px; margin: 8px 0;">
                    <li>打开手机上的 <b>Magisk</b> 应用；</li>
                    <li>点击下方 <b>【模块】</b> 标签页；</li>
                    <li>找到 <b>【Mihomo 系统级透明代理】</b>；</li>
                    <li>点击右侧的 <b>【操作】(Action)</b> 按钮；</li>
                    <li>选择 <b>[2] 输入订阅链接</b> 即可直接粘贴链接更新！</li>
                </ol>
            </div>
        </div>
    </div>
</body>
</html>
